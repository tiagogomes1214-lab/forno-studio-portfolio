name: Verificacao do Forno Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://forno-studio-api.onrender.com
          NEXT_PUBLIC_DEMO_MODE: 'true'
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend/app
      - name: Instalar dependencias e testes da API
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Testar endpoints, pedidos e painel
        run: PYTHONPATH=backend python -m pytest -q backend/tests
