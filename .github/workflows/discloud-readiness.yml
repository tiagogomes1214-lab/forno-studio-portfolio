name: Validar pacote Discloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  discloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar discloud.config e ponto de entrada
        run: |
          test -f discloud.config
          test -f server.js
          test -f frontend/package-lock.json
          grep -Fxq 'TYPE=site' discloud.config
          grep -Fxq 'MAIN=server.js' discloud.config
          grep -Fxq 'BUILD=npm run build' discloud.config
          grep -Fxq 'START=npm run start' discloud.config
          grep -Fxq 'ID=fornostudio-tiago' discloud.config
          grep -q 'next start -H 0.0.0.0 -p 8080' frontend/package.json
          node --check server.js
          node --check scripts/discloud-build.cjs
      - name: Instalar dependencias de runtime na raiz (como Docker Discloud)
        run: npm install --omit=dev --no-audit --no-fund
      - name: Build sem variaveis (simula o builder Docker da Discloud)
        run: |
          unset NEXT_PUBLIC_API_URL NEXT_PUBLIC_DEMO_MODE NEXT_PUBLIC_SITE_URL
          npm run build
      - name: Testar servidor Next.js na porta 8080
        env:
          NEXT_PUBLIC_API_URL: https://forno-studio-api.onrender.com
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_SITE_URL: https://fornostudio-tiago.discloud.app
        run: |
          # O runtime da Discloud pode não preservar frontend/node_modules.
          # Simula exatamente o erro MODULE_NOT_FOUND fornecido no log.
          mv frontend/node_modules "$RUNNER_TEMP/forno-frontend-node_modules"
          test -d node_modules/next
          test ! -d frontend/node_modules
          node server.js > /tmp/forno-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null && curl --fail --silent http://127.0.0.1:8080/pedir > /dev/null; then
              echo "Páginas / e /pedir funcionando na porta 8080"
              exit 0
            fi
            sleep 2
          done
          echo "Servidor não respondeu a tempo. Logs:"
          tail -80 /tmp/forno-next.log
          exit 1
